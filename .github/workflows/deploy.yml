name: deploy

# Staging follows main. Production is deployed by hand, from the Actions tab
# ("Run workflow", environment: production), never automatically.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

# One deploy per environment at a time; a newer one waits rather than racing.
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Until the product owner has added the two secrets (ash-backend#2),
      # there is nothing to deploy to: say so and stop, rather than fail.
      - name: Cloudflare credentials are set
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping the deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.ready.outputs.ready == 'true'
        uses: actions/checkout@v7

      - if: steps.ready.outputs.ready == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - if: steps.ready.outputs.ready == 'true'
        run: npm ci

      # The same checks as a pull request, so nothing untested is deployed.
      - if: steps.ready.outputs.ready == 'true'
        run: npm run typecheck && npm test

      - if: steps.ready.outputs.ready == 'true'
        env:
          TARGET: ${{ inputs.environment || 'staging' }}
        run: node scripts/deploy.mjs "$TARGET"
